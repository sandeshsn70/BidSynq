# Local development only. Set SECRET_KEY in your shell or a .env file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bidsynq
      POSTGRES_PASSWORD: bidsynq_local
      POSTGRES_DB: bidsynq
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://bidsynq:bidsynq_local@db:5432/bidsynq
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CORS_ORIGINS: http://localhost:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
